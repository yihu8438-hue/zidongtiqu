<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>达人信息自动提取工具</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Arial;margin:16px;background:#f6f7f9;color:#222}
  h2{margin:8px 0 12px}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  textarea{width:100%;height:260px;padding:10px;border:1px solid #ccd;border-radius:8px;font-family:Consolas,monospace;font-size:13px;box-sizing:border-box}
  button{padding:8px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;margin-right:8px}
  button.secondary{background:#64748b}
  button.green{background:#16a34a}
  .bar{margin:10px 0}
  table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
  th,td{border:1px solid #dbe1ea;padding:6px 8px;text-align:left;vertical-align:top}
  th{background:#eef2f7;white-space:nowrap}
  .hint{color:#64748b;font-size:12px;margin:6px 0}
  #msg{color:#b91c1c;font-size:13px;margin-left:8px}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<h2>达人信息自动提取</h2>
<div class="hint">支持一次粘贴多条（用空行分隔，或用“收件人:”开头自动分条）。字段：抖音名/抖音号/UID/合作码/收件人/手机号码/所在地区/详细地址</div>

<div class="wrap">
  <div>
    <textarea id="input" placeholder="在这里粘贴原始文本..."></textarea>
    <div class="bar">
      <button onclick="run()">提取</button>
      <button class="secondary" onclick="clearAll()">清空</button>
      <button class="green" onclick="exportCSV()">导出 CSV</button>
      <button class="secondary" onclick="copyTable()">复制结果</button>
      <span id="msg"></span>
    </div>
  </div>
  <div>
    <table id="out">
      <thead>
        <tr>
          <th>达人名称</th><th>达人ID</th><th>UID</th><th>合作码</th>
          <th>收件人</th><th>手机号码</th><th>收货地址</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const FIELDS = ["达人名称","达人ID","UID","合作码","收件人","手机号码","收货地址"];

function norm(s){
  return (s||"").replace(/\r/g,"").replace(/[：:]\s*/g,"：").trim();
}

// 按块拆分：优先按“收件人:”起点切分；否则按空行
function splitBlocks(text){
  const t = text.replace(/\r/g,"");
  if(/收件人\s*[:：]/.test(t)){
    const parts = t.split(/(?=收件人\s*[:：])/g).map(s=>s.trim()).filter(Boolean);
    return parts;
  }
  return t.split(/\n\s*\n+/).map(s=>s.trim()).filter(Boolean);
}

function pick(block, labels){
  for(const lab of labels){
    // 行内：标签: 值
    const re = new RegExp(lab + "\\s*[:：]\\s*([^\\n\\r]+)","i");
    const m = block.match(re);
    if(m && m[1].trim()) return m[1].trim();
  }
  return "";
}

function parseBlock(block){
  const 达人名称 = pick(block,["抖音名","达人名称","昵称"]);
  const 达人ID  = pick(block,["抖音号","达人ID","达人id"]);
  const UID     = pick(block,["UID","Uid","uid"]);
  const 合作码  = pick(block,["合作码"]);
  const 收件人  = pick(block,["收件人"]);
  const 手机号码= pick(block,["手机号码","手机号","电话"]);
  const 所在地区= pick(block,["所在地区","地区","省市区"]);
  const 详细地址= pick(block,["详细地址","地址"]);

  // 收货地址 = 所在地区 + 详细地址（去重拼接）
  let 收货地址 = "";
  if(所在地区 && 详细地址){
    收货地址 = 详细地址.startsWith(所在地区) ? 详细地址 : (所在地区 + 详细地址);
  }else{
    收货地址 = 所在地区 || 详细地址;
  }
  // 清理多余空格
  收货地址 = 收货地址.replace(/\s+/g," ").trim();

  return {达人名称,达人ID,UID,合作码,收件人,手机号码,收货地址};
}

let rows = [];

function run(){
  const msg = document.getElementById("msg");
  msg.textContent = "";
  const text = document.getElementById("input").value;
  if(!text.trim()){ msg.textContent = "请先粘贴文本"; return; }

  const blocks = splitBlocks(text);
  rows = blocks.map(parseBlock).filter(r => Object.values(r).some(v=>v));

  const tbody = document.querySelector("#out tbody");
  tbody.innerHTML = "";
  rows.forEach(r=>{
    const tr = document.createElement("tr");
    FIELDS.forEach(f=>{
      const td = document.createElement("td");
      td.textContent = r[f] || "";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  if(!rows.length) msg.textContent = "没识别到有效字段，请检查格式";
}

function clearAll(){
  document.getElementById("input").value = "";
  document.querySelector("#out tbody").innerHTML = "";
  document.getElementById("msg").textContent = "";
  rows = [];
}

function copyTable(){
  if(!rows.length){ document.getElementById("msg").textContent = "没有可复制的结果"; return; }
  const head = FIELDS.join("\t");
  const body = rows.map(r=>FIELDS.map(f=>r[f]||"").join("\t")).join("\n");
  const text = head + "\n" + body;
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById("msg").style.color = "#16a34a";
    document.getElementById("msg").textContent = "已复制到剪贴板";
    setTimeout(()=>{document.getElementById("msg").textContent="";document.getElementById("msg").style.color="#b91c1c";},1500);
  }).catch(()=>{
    // 兼容旧浏览器
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    document.getElementById("msg").textContent = "已复制";
  });
}

function exportCSV(){
  if(!rows.length){ document.getElementById("msg").textContent = "没有可导出的结果"; return; }
  const esc = v => '"' + String(v||"").replace(/"/g,'""') + '"';
  const lines = [FIELDS.map(esc).join(",")];
  rows.forEach(r=>lines.push(FIELDS.map(f=>esc(r[f])).join(",")));
  const blob = new Blob(["\ufeff"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "达人信息提取.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
